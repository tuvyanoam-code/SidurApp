name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Install Bubblewrap core
        run: |
          mkdir -p twa-build
          cd twa-build
          npm init -y > /dev/null
          npm install @bubblewrap/core color --silent

      - name: Generate signing keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/sidur.keystore ]; then
            "$JAVA_HOME/bin/keytool" -genkeypair -v \
              -keystore ~/.android/sidur.keystore \
              -alias sidur \
              -storepass sidur-app \
              -keypass sidur-app \
              -keyalg RSA -keysize 2048 -validity 25000 \
              -dname "CN=Sidur App, OU=Personal, O=tuvyanoam, L=Jerusalem, ST=Israel, C=IL"
          fi
          ls -la ~/.android

      - name: Generate TWA project (programmatic, non-interactive)
        run: |
          cd twa-build
          cat > generate.js <<'EOF'
          const { TwaGenerator, TwaManifest } = require('@bubblewrap/core');
          const Color = require('color');
          const path = require('path');
          const os = require('os');

          (async () => {
            const url = 'https://tuvyanoam-code.github.io/SidurApp/manifest.json';
            const res = await fetch(url);
            const webManifest = await res.json();
            const tm = TwaManifest.fromWebManifestJson(new URL(url), webManifest);
            tm.packageId = 'com.tuvyanoam.sidur';
            tm.host = 'tuvyanoam-code.github.io';
            tm.startUrl = '/SidurApp/';
            tm.name = "סידור תהילת ה'";
            tm.launcherName = 'סידור';
            tm.iconUrl = 'https://tuvyanoam-code.github.io/SidurApp/icons/icon-512.png';
            tm.maskableIconUrl = 'https://tuvyanoam-code.github.io/SidurApp/icons/icon-512.png';
            tm.appVersionName = '1.0.0';
            tm.appVersionCode = 1;
            tm.themeColor = new Color('#0f4c2e');
            tm.themeColorDark = new Color('#0f4c2e');
            tm.navigationColor = new Color('#0f4c2e');
            tm.navigationColorDark = new Color('#0f4c2e');
            tm.navigationDividerColor = new Color('#0f4c2e');
            tm.navigationDividerColorDark = new Color('#0f4c2e');
            tm.backgroundColor = new Color('#f5f3ec');
            tm.fallbackType = 'customtabs';
            tm.minSdkVersion = 21;
            tm.signingKey = { path: path.join(os.homedir(), '.android', 'sidur.keystore'), alias: 'sidur' };

            await tm.saveToFile('twa-manifest.json');

            const gen = new TwaGenerator();
            const log = { debug: ()=>{}, info: console.log, warn: console.warn, error: console.error, newLog: () => log };
            await gen.createTwaProject('.', tm, log);
            console.log('TWA project generated.');
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
          node generate.js
          ls -la

      - name: Build & sign APK with Gradle
        run: |
          cd twa-build
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          echo "--- APK locations ---"
          find . -name "*.apk" -o -name "*.aab" | head -20

      - name: Sign APK (apksigner)
        run: |
          cd twa-build
          UNSIGNED=$(find app/build/outputs/apk/release -name "*release-unsigned.apk" | head -1 || true)
          SIGNED=$(find app/build/outputs/apk/release -name "*release.apk" | grep -v unsigned | head -1 || true)
          OUT=app-release-signed.apk
          if [ -n "$SIGNED" ] && [ -f "$SIGNED" ]; then
            cp "$SIGNED" "$OUT"
            echo "Already signed: $OUT"
          elif [ -n "$UNSIGNED" ] && [ -f "$UNSIGNED" ]; then
            APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
            "$APKSIGNER" sign \
              --ks ~/.android/sidur.keystore \
              --ks-key-alias sidur \
              --ks-pass pass:sidur-app \
              --key-pass pass:sidur-app \
              --out "$OUT" "$UNSIGNED"
            echo "Signed: $OUT"
          else
            echo "No APK found"; ls -la app/build/outputs/apk/release/ || true; exit 1
          fi
          ls -la "$OUT"
          # Bundle (AAB) for Play Store
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -1 || true)
          if [ -n "$AAB" ] && [ -f "$AAB" ]; then cp "$AAB" app-release.aab; fi

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidur-app-apk
          path: |
            twa-build/app-release-signed.apk
            twa-build/app-release.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            APK build from commit ${{ github.sha }}.
            Install on Android: download `app-release-signed.apk`, open it on the phone,
            allow "install from unknown sources" if prompted.
          files: |
            twa-build/app-release-signed.apk
            twa-build/app-release.aab
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
