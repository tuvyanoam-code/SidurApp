name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Install Bubblewrap core
        run: |
          mkdir -p twa-build
          cd twa-build
          npm init -y > /dev/null
          npm install @bubblewrap/core --silent

      - name: Generate signing keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/sidur.keystore ]; then
            "$JAVA_HOME/bin/keytool" -genkeypair -v \
              -keystore ~/.android/sidur.keystore \
              -alias sidur \
              -storepass sidur-app \
              -keypass sidur-app \
              -keyalg RSA -keysize 2048 -validity 25000 \
              -dname "CN=Sidur App, OU=Personal, O=tuvyanoam, L=Jerusalem, ST=Israel, C=IL"
          fi
          ls -la ~/.android

      - name: Generate TWA project (programmatic, non-interactive)
        run: |
          cd twa-build
          # Write a complete twa-manifest.json (the canonical Bubblewrap input).
          # Letting TwaManifest.fromJsonFile() parse it gives us proper Color objects.
          cat > twa-manifest.json <<'JSON'
          {
            "packageId": "com.tuvyanoam.sidur",
            "host": "tuvyanoam-code.github.io",
            "name": "סידור תהילת ה'",
            "launcherName": "סידור",
            "display": "standalone",
            "orientation": "portrait",
            "themeColor": "#0f4c2e",
            "navigationColor": "#0f4c2e",
            "navigationColorDark": "#0f4c2e",
            "navigationDividerColor": "#0f4c2e",
            "navigationDividerColorDark": "#0f4c2e",
            "backgroundColor": "#f5f3ec",
            "enableNotifications": false,
            "startUrl": "/SidurApp/",
            "iconUrl": "https://tuvyanoam-code.github.io/SidurApp/icons/icon-512.png",
            "maskableIconUrl": "https://tuvyanoam-code.github.io/SidurApp/icons/icon-512.png",
            "appVersionName": "1.0.0",
            "appVersion": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://tuvyanoam-code.github.io/SidurApp/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://tuvyanoam-code.github.io/SidurApp/",
            "minSdkVersion": 21,
            "signingKey": { "path": "/home/runner/.android/sidur.keystore", "alias": "sidur" }
          }
          JSON

          cat > generate.js <<'EOF'
          const { TwaGenerator, TwaManifest } = require('@bubblewrap/core');
          (async () => {
            const tm = await TwaManifest.fromFile('twa-manifest.json');
            const gen = new TwaGenerator();
            const log = { debug: () => {}, info: console.log, warn: console.warn, error: console.error, newLog: () => log };
            await gen.createTwaProject('.', tm, log);
            console.log('TWA project generated.');
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
          node generate.js
          ls -la

      - name: Build & sign APK with Gradle
        run: |
          cd twa-build
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          echo "--- APK locations ---"
          find . -name "*.apk" -o -name "*.aab" | head -20

      - name: Sign APK (apksigner)
        run: |
          cd twa-build
          UNSIGNED=$(find app/build/outputs/apk/release -name "*release-unsigned.apk" | head -1 || true)
          SIGNED=$(find app/build/outputs/apk/release -name "*release.apk" | grep -v unsigned | head -1 || true)
          OUT=app-release-signed.apk
          if [ -n "$SIGNED" ] && [ -f "$SIGNED" ]; then
            cp "$SIGNED" "$OUT"
            echo "Already signed: $OUT"
          elif [ -n "$UNSIGNED" ] && [ -f "$UNSIGNED" ]; then
            APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
            "$APKSIGNER" sign \
              --ks ~/.android/sidur.keystore \
              --ks-key-alias sidur \
              --ks-pass pass:sidur-app \
              --key-pass pass:sidur-app \
              --out "$OUT" "$UNSIGNED"
            echo "Signed: $OUT"
          else
            echo "No APK found"; ls -la app/build/outputs/apk/release/ || true; exit 1
          fi
          ls -la "$OUT"
          # Bundle (AAB) for Play Store
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -1 || true)
          if [ -n "$AAB" ] && [ -f "$AAB" ]; then cp "$AAB" app-release.aab; fi

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidur-app-apk
          path: |
            twa-build/app-release-signed.apk
            twa-build/app-release.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            APK build from commit ${{ github.sha }}.
            Install on Android: download `app-release-signed.apk`, open it on the phone,
            allow "install from unknown sources" if prompted.
          files: |
            twa-build/app-release-signed.apk
            twa-build/app-release.aab
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
