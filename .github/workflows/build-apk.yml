name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Stage offline web assets
        run: |
          # Bundle the entire web app into the APK as android assets.
          # No browser, no GitHub-Pages dependency, no network needed.
          mkdir -p android/app/src/main/assets/web
          # Copy everything except git/CI/build dirs and other source-only files
          rsync -av --exclude='.git' --exclude='.github' --exclude='android' \
                    --exclude='node_modules' --exclude='*.json.bak' \
                    --exclude='sefaria_data.json' --exclude='sefaria_chabad.json' \
                    --exclude='sidur_data.json' --exclude='.gitignore' \
                    --exclude='.claude' \
                    ./ android/app/src/main/assets/web/
          ls android/app/src/main/assets/web/

      - name: Generate signing keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/sidur.keystore ]; then
            "$JAVA_HOME/bin/keytool" -genkeypair -v \
              -keystore ~/.android/sidur.keystore \
              -alias sidur \
              -storepass sidur-app \
              -keypass sidur-app \
              -keyalg RSA -keysize 2048 -validity 25000 \
              -dname "CN=Sidur App, OU=Personal, O=tuvyanoam, L=Jerusalem, ST=Israel, C=IL"
          fi

      - name: Write Android Gradle project files
        run: |
          set -e
          cd android

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Sidur"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF

          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          mkdir -p app/src/main/java/com/tuvyanoam/sidur
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/xml

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.tuvyanoam.sidur'
              compileSdk 34
              defaultConfig {
                  applicationId "com.tuvyanoam.sidur"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv('HOME') + '/.android/sidur.keystore')
                      storePassword 'sidur-app'
                      keyAlias 'sidur'
                      keyPassword 'sidur-app'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/AppTheme"
                  android:allowBackup="true"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode"
                      android:windowSoftInputMode="adjustResize"
                      android:theme="@style/AppTheme.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/tuvyanoam/sidur/MainActivity.java <<'EOF'
          package com.tuvyanoam.sidur;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  // Edge-to-edge / immersive look
                  getWindow().setStatusBarColor(0xFF0F4C2E);
                  getWindow().setNavigationBarColor(0xFF0F4C2E);
                  webView.setBackgroundColor(0xFFF5F3EC);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, android.webkit.WebResourceRequest req) {
                          // Keep navigation inside the app for our own files; let any external
                          // links (Hebcal/Sefaria) be opened by the WebView too (we want them
                          // to load the JSON for the calendar inline).
                          return false;
                      }
                  });

                  webView.loadUrl("file:///android_asset/web/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">סידור</string>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="brand">#0F4C2E</color>
              <color name="brand_dark">#0A3622</color>
              <color name="paper">#F5F3EC</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight">
                  <item name="colorPrimary">@color/brand</item>
                  <item name="colorPrimaryDark">@color/brand_dark</item>
                  <item name="android:statusBarColor">@color/brand</item>
                  <item name="android:windowBackground">@color/paper</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/brand</item>
                  <item name="colorPrimaryDark">@color/brand_dark</item>
                  <item name="android:statusBarColor">@color/brand</item>
                  <item name="android:windowBackground">@color/paper</item>
              </style>
          </resources>
          EOF

          # Adaptive icon (Android 8+) — uses the icon-512.png we ship with the web app
          mkdir -p app/src/main/res/drawable
          cp ../icons/icon-512.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp ../icons/icon-512.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cp ../icons/icon-512.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/brand" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/brand" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          # Generate the gradle wrapper jar
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          ls -la

      - name: Build & sign release APK
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease bundleRelease
          find . -name "*.apk" -path "*/release/*"
          find . -name "*.aab" -path "*/release/*"

      - name: Stage outputs
        run: |
          cd android
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -1 || true)
          cp "$APK" ../app-release-signed.apk
          [ -n "$AAB" ] && cp "$AAB" ../app-release.aab
          ls -la ../app-release-signed.apk ../app-release.aab 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidur-app-apk
          path: |
            app-release-signed.apk
            app-release.aab
          retention-days: 30

      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            סידור תהילת ה' — APK עצמאי לאנדרואיד.

            כל הטקסט, העיצוב והלוגיקה ארוזים בתוך ה-APK. אין צורך בכרום, אין
            צורך בחיבור לאינטרנט מלבד טעינת לוח השנה והזמנים מ-Hebcal (וגם
            זה ממשיך לעבוד מהמטמון אחרי כניסה ראשונה).

            Built from commit ${{ github.sha }}.
          files: |
            app-release-signed.apk
            app-release.aab
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
