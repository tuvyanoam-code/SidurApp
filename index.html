<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>סידור תהילת ה'</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
<meta name="theme-color" content="#0f4c2e" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- Top app header -->
<header class="app-header">
  <button class="header-btn" id="locBtn" type="button" title="עיר / מיקום">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
    <span id="locLabel">ירושלים</span>
  </button>
  <div class="header-spacer"></div>
  <button class="header-btn icon-only" id="searchBtn" title="חיפוש">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </button>
  <button class="header-btn icon-only" id="themeBtn" title="מצב תצוגה">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</header>

<!-- ───────── HOME SCREEN ───────── -->
<section id="screen-home" class="screen active">

  <div class="brand">
    <span class="brand-mark"></span>
    <h1 class="brand-title">סידור תהילת ה'</h1>
    <p class="brand-sub" id="dateLine">…</p>
  </div>

  <!-- Calendar / Zmanim card -->
  <div class="zmanim-card" id="zmanimCard">
    <div class="zmanim-head">
      <div>
        <div class="zmanim-hebrew-date" id="hebrewDate">…</div>
        <div class="zmanim-parsha" id="parshaLine">…</div>
      </div>
      <div class="zmanim-pill" id="dayKindPill">חול</div>
    </div>
    <div class="zmanim-grid" id="zmanimGrid">
      <div class="zmanim-skeleton"></div>
      <div class="zmanim-skeleton"></div>
      <div class="zmanim-skeleton"></div>
      <div class="zmanim-skeleton"></div>
    </div>
  </div>

  <!-- Now / Highlighted prayer (smart suggestion) -->
  <div class="section-label">
    <span>עכשיו</span>
    <small id="nowReason">לפי שעה ותאריך</small>
  </div>

  <button class="now-card" id="nowCard" type="button">
    <div class="now-card-glow"></div>
    <div class="now-card-content">
      <div class="now-tag" id="nowTag">תפילה נוכחית</div>
      <div class="now-title" id="nowTitle">…</div>
      <div class="now-meta" id="nowMeta">…</div>
    </div>
    <svg class="now-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>

  <!-- All prayers list -->
  <div class="section-label"><span>כל התפילות</span></div>
  <div class="prayers-list" id="prayersList">
    <!-- items injected by JS -->
  </div>

  <footer class="home-footer">
    <p>סידור תהילת ה' • נוסח חב"ד</p>
    <p class="muted-small">המקורות: לוח השנה והזמנים מ־Hebcal • טקסט הסידור — סידור תהילת ה'</p>
  </footer>
</section>

<!-- ───────── PRAYER DETAIL SCREEN ───────── -->
<section id="screen-prayer" class="screen">
  <div class="prayer-top">
    <button class="header-btn icon-only" id="backBtn" title="חזרה">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <div class="prayer-top-title" id="prayerTopTitle">…</div>
    <button class="header-btn icon-only" id="tocBtn" title="ניווט בקטעים">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    </button>
  </div>

  <article class="prayer-body" id="prayerBody">
    <!-- text injected -->
  </article>
</section>

<!-- TOC bottom sheet -->
<div class="sheet-mask" id="sheetMask"></div>
<aside class="toc-sheet" id="tocSheet" aria-hidden="true">
  <div class="sheet-handle"></div>
  <div class="sheet-title">קטעי התפילה</div>
  <ul class="toc-list" id="tocList"></ul>
</aside>

<script src="prayers.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
